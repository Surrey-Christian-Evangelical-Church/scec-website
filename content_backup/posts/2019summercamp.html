
<p>在美丽的Sasamat Lake湖边，我们成功举办了2019年夫妻家庭夏令营，邀请了讲员胡传道来我们中间进行了三天的学习培训。讲员深入浅出的信息与美好的见证，以及教会弟兄姐妹的相互陪伴与交流，让我们不仅灵命有极大的收获，而且身心灵也得到极大的休整。感谢主！</p>
